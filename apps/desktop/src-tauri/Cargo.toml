[package]
name = "msviewer-tauri"
version = "0.0.0"
edition = "2021"
description = "MsViewer Tauri shell (M0 stub)"

[[bin]]
name = "msviewer-tauri"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { workspace = true }
serde_json = "1"
# Kept in lockstep with flashlfq-core via the root workspace (arrow 54.x line).
arrow = { workspace = true }
# The engine core, now a workspace sibling (../../../crates/flashlfq-core), not a vendored copy.
flashlfq-core = { path = "../../../crates/flashlfq-core" }
# Native file-open dialog (real .raw/mzML path → open_dataset).
tauri-plugin-dialog = "2"
